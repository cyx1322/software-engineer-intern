# CI: test the backend, then build the Compose images and publish the API image to GHCR.
#
# Trigger decision: every push to `main`, and nothing else. The submission is
# one commit per module on `main`, so every submitted commit is tested, and
# images are published only from `main`. Pushes to other branches and pull
# requests do not run this workflow.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"] # the lowest supported version and the Docker image's version
    services:
      mongo: # for the second run of the suite, against a real server
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full suite on in-memory MongoDB (mongomock)
        run: python -m pytest q1_api/
      - name: Full suite on MongoDB 8
        run: python -m pytest q1_api/
        env:
          TEST_MONGO_URL: mongodb://localhost:27017

  build:
    name: Build images and publish to GHCR
    needs: test # runs only when every test job above succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: docker compose build
        working-directory: q3_deploy
        run: |
          cp .env.example .env # Compose requires the env_file; CI uses the placeholders
          docker compose build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the API image
        # Compose named the image <project>-<service>; the project is the directory name, q3_deploy.
        # The mock images are built above but not published: they stand in for external services.
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api" # registry paths must be lowercase
          for tag in "$GITHUB_SHA" latest; do
            docker tag q3_deploy-api "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image:$GITHUB_SHA and :latest" >> "$GITHUB_STEP_SUMMARY"
