# The only entry point to the stack (host port 8080 -> 80).
server {
    listen 80;

    location /api/ {
        # No URI after the host, so the path (/api/...) is forwarded unchanged.
        proxy_pass http://api:8000;
        # Batch CSVs exceed nginx's 1 MB default. Larger uploads get 413 here, before reaching the API.
        client_max_body_size 10m;
        # The slowest API request is an export, which delivers before it responds:
        # at most 6 attempts x 5 s plus 15.5 s of backoff, about 46 s.
        proxy_read_timeout 60s;
        # A stopped api container does not refuse connections; they hang. Without
        # this limit a client would wait 60 s for the 504 instead of 2 s.
        proxy_connect_timeout 2s;
    }

    location /ocr/ {
        # No URI after the host, so /ocr/parse reaches the mock unchanged, as its contract requires.
        proxy_pass http://mock_ocr:9100;
        # The same limits as the API's OCR client: a hung parse returns 504 after 5 s,
        # instead of holding the client for the mock's 600 s delay.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
